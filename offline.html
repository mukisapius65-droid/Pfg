<!DOCTYPE html>
<html>
<head>
    <title>PFG Chapati - Offline</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #fff5e6;
            text-align: center;
            padding: 20px;
        }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; max-width: 400px; line-height: 1.6; }
        .feature {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="icon">🥞</div>
    <h1>You're Offline</h1>
    <p>But you can still view PFG Chapati features!</p>
    
    <div class="feature">
        <h3>📋 View Menu</h3>
        <p>Browse chapati options and prices</p>
    </div>
    
    <div class="feature">
        <h3>📍 Find Makers</h3>
        <p>See available chapati makers in Kampala</p>
    </div>
    
    <div class="feature">
        <h3>📞 Contact Info</h3>
        <p>Access our WhatsApp and location</p>
    </div>
    
    <p style="margin-top: 30px; color: #888; font-size: 14px;">
        Reconnect to place an order
    </p>
</body>
</html>
